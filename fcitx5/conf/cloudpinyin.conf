# ============================================================================
# fcitx5 云拼音配置
# ============================================================================
# 在本地拼音之上叠加云端候选词（需联网）。
# ============================================================================

# 触发云端候选的最小拼音长度（少于则不请求云端）
MinimumPinyinLength=4
# 云端候选后端（Baidu = 百度云拼音）
Backend=Baidu
# 代理（留空=直连）
Proxy=

[Toggle Key]
0=Control+Alt+Shift+C   # 切换云拼音开关的快捷键
