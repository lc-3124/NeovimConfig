# 双拼方案
# ShuangpinProfile=Ziranma
# 显示当前双拼模式
# ShowShuangpinMode=True
# 每页候选词
# PageSize=7
# 显示英文候选词
# SpellEnabled=True
# 显示符号候选词
# SymbolsEnabled=True
# 显示拆字候选词
# ChaiziEnabled=True
# 启用 Unicode CJK 拓展区 B 之后的更多字符
# ExtBEnabled=True
# 输入 h(横)，s(竖)，p(撇)，n(捺)，z(折) 时显示笔画候选词
# StrokeCandidateEnabled=True
# 启用云拼音
CloudPinyinEnabled=True
# 云拼音候选词顺序
# CloudPinyinIndex=2
# 加载云拼音的时候显示动画
# CloudPinyinAnimation=True
# 总是显示云拼音的占位符
# KeepCloudPinyinPlaceHolder=False
# 预编辑模式
# PreeditMode="Composing pinyin"
# 将嵌入预编辑文本的光标固定在开头
# PreeditCursorPositionAtBeginning=True
# 在预编辑中显示完整拼音
# PinyinInPreedit=False
# 启用预测
Prediction=True
# 为下次输入预测保留当前输入的文本
# KeepCurrentContext=True
# 预测数量
# PredictionSize=49
# 预测时退格键的行为
# BackspaceBehaviorOnPrediction="Backspace when not using on-screen keyboard"
# 切换输入法时的行为
# SwitchInputMethodBehavior="Commit current preedit"
# 学习
# Learning=True
# 选择第二个候选词
# SecondCandidate=
# 选择第三个候选词
# ThirdCandidate=
# 使用数字键盘选词
# UseKeypadAsSelection=False
# 选词末字
# ChooseLastCharFromPhrase=bracketright
# 使用退格键取消选词
# BackSpaceToUnselect=True
# 句子数量
# Number of sentence=2
# 词组候选词数
# WordCandidateLimit=15
# 输入长于...时提示长词 (设置为 0 时禁用)
# LongWordLengthLimit=4
# 快速输入的触发键
# QuickPhraseKey=semicolon
# 使用 V 来触发快速输入
# VAsQuickphrase=True
# FirstRun
FirstRun=False

# [ForgetWord]
# 0=Control+7

# [PrevPage]
# 0=minus
# 1=Up
# 2=KP_Up
# 3=Page_Up

# [NextPage]
# 0=equal
# 1=Down
# 2=KP_Down
# 3=Next

# [PrevCandidate]
# 0=Shift+Tab

# [NextCandidate]
# 0=Tab

# [CurrentCandidate]
# 0=space
# 1=KP_Space

# [CommitRawInput]
# 0=Return
# 1=KP_Enter
# 2=Control+Return
# 3=Control+KP_Enter
# 4=Shift+Return
# 5=Shift+KP_Enter
# 6=Control+Shift+Return
# 7=Control+Shift+KP_Enter

[ChooseCharFromPhrase]
0=bracketleft
1=bracketright

# [FilterByStroke]
# 0=grave

[QuickPhraseTriggerRegex]
0=.(/|@)$
1="^(www|bbs|forum|mail|bbs)\\\\."
2=^(http|https|ftp|telnet|mailto):

[Fuzzy]
# 模糊音：保守开启，只开最常见、歧义最低的几组。
# ue -> ve
VE_UE=True
# an <-> ang
AN_ANG=True
# en <-> eng
EN_ENG=True
# in <-> ing
IN_ING=True
# c <-> ch
C_CH=True
# s <-> sh
S_SH=True
# z <-> zh
Z_ZH=True
# 以下故意保持关闭，避免过度模糊、误伤正确输入：
#   NG_GN / Inner(内模糊音节) / InnerShort / PartialFinal(不完整元音)
#   PartialSp / V_U / IAN_IANG / U_OU / UAN_UANG / F_H / L_N / L_R
# 小写时匹配字母
# LowerCaseMatchLetter=True
# 纠错布局
# Correction=None

