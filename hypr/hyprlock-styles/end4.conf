# =============================================================================
# hyprlock style: end-4 / dots-hyprland  (minimal centred clock, no wallpaper)
# source : github.com/end-4/dots-hyprland  ->  dots/.config/hypr/hyprlock.conf
#          + dots/.config/hypr/hyprlock/colors.conf (matugen-generated variables, inlined)
#          + dots/.config/hypr/hyprlock/check-capslock.sh, status.sh (copied locally)
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * removed    : "source=~/.config/hypr/hyprlock/colors.conf" -> all $... colour
#                  variables inlined with the values shipped in that file
#   * fonts      : "Google Sans Flex Medium" -> Nunito, JetBrainsMono Nerd Font
#   * $TIME      : env variable (provided by end-4's wrapper) -> cmd[update:1000] date
#   * $LAYOUT    : env variable -> cmd[update:1000] hyprctl devices -j | jq ... (jq is installed)
#   * scripts    : hyprlock/{check-capslock,status}.sh -> hyprlock-styles/end4-*.sh
#   * added      : auth { fingerprint { ... } }
#   * KEPT       : background { color = rgba(181818FF) } - this style is deliberately
#                  wallpaper-less (solid dark), so its color= is preserved.
# =============================================================================

background {
    color = rgba(181818FF)
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = rgba(8f909955)
    inner_color = rgba(00194411)
    font_color = rgba(d9e2ffFF)
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j | jq -r '.keyboards[0].active_keymap'
    color = rgba(d9e2ffFF)
    font_size = 14
    font_family = Nunito, JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] /home/lc3124/.config/hypr/hyprlock-styles/end4-check-capslock.sh
    color = rgba(d9e2ffFF)
    font_size = 13
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -25
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(d9e2ffFF)
    font_size = 65
    font_family = Nunito, JetBrainsMono Nerd Font

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(d9e2ffFF)
    font_size = 17
    font_family = Nunito, JetBrainsMono Nerd Font

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text =   $USER
    color = rgba(d9e2ffFF)
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 20
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] /home/lc3124/.config/hypr/hyprlock-styles/end4-status.sh
    color = rgba(d9e2ffFF)
    font_size = 14
    font_family = Nunito, JetBrainsMono Nerd Font

    position = 30, -30
    halign = left
    valign = top
}
