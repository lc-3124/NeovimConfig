# =============================================================================
# hyprlock style: VivekRajan Style-8  (oversized HH / MM slab digits, amber+white)
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-8/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hyprlock.png -> resource/images/lock-bg.png
#   * fonts      : AlfaSlabOne / "SF Pro Display Bold" -> Nunito, JetBrainsMono Nerd Font
#   * removed    : general { no_fade_in, grace, disable_loading_bar } (invalid in 0.9.6)
#   * added      : auth { fingerprint { ... } }
#   * replaced   : ~/.config/hypr/Scripts/songdetail.sh -> hyprlock-styles/songdetail.sh
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/lock-bg.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">Hi, $USER</span></i>
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 185, 0, .6)
    font_size = 180
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, .6)
    font_size = 180
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##ffffff99'>$(date '+%A, ')</span><span color='##ffb90099'>$(date '+%d %B')</span>"
    font_size = 30
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# USER icon
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, .65)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/songdetail.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font, Nunito
    position = 0, 60
    halign = center
    valign = bottom
}
