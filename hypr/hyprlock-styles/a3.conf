# =============================================================================
# hyprlock style: A3TH3Rr Hyprlock-Dots  (centred clock + floating MPRIS widget)
# source : github.com/A3TH3Rr/Hyprlock-Dots  ->  hyprlock.conf
#          + scripts/hyprlock-music.sh, scripts/music.webp (copied locally)
# licence: MIT
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : fantasy-style-galaxy-background.jpg -> resource/images/background.png
#   * fonts      : "SF Pro Display *" -> Nunito, JetBrainsMono Nerd Font
#   * $TIME      : env variable -> cmd[update:1000] date +"%H:%M"
#   * replaced   : profile photo ($HOME/Pictures/user.jpg) -> Nerd Font user glyph
#   * replaced   : scripts/hyprlock-music.sh -> hyprlock-styles/a3-hyprlock-music.sh
#                  and scripts/music.webp -> hyprlock-styles/a3-music.webp
#                  (that copy also falls back to the bundled placeholder when no
#                   player is running, so the album-art image path is never empty)
#   * kept       : animations { animation = fade/... } - the "animation"/"bezier"
#                  keywords are valid hyprlock 0.9.x (confirmed against the wiki)
#   * added      : auth { fingerprint { ... } }
# =============================================================================

# ----------------------------------------------------------------------------
# Background
# ----------------------------------------------------------------------------
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/background.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
    ignore_empty_input = true
    hide_cursor = true
}

# ----------------------------------------------------------------------------
# Animations
# ----------------------------------------------------------------------------
animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffff99">Enter Pass</span>
    hide_input = false
    position = 0, -153
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Clock & Date Display
# ----------------------------------------------------------------------------

# Time (large display)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(216, 222, 233, 0.70)
    font_size = 140
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 260
    halign = center
    valign = center
}

# Date (day and month)
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Lock Icon
label {
    monitor =
    text = <span></span>
    color = rgba(216, 222, 233, 0.70)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 2, -110
    halign = center
    valign = top
}

# ----------------------------------------------------------------------------
# User Profile
# ----------------------------------------------------------------------------

# Profile icon (was: image $HOME/Pictures/user.jpg)
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

# Username greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# ============================================================================
# Music Player Widget
# ============================================================================

# Album Art
image {
    monitor =
    path = /home/lc3124/.config/hypr/hyprlock-styles/a3-music.webp
    size = 100
    rounding = 5
    border_size = 3
    border_color = rgba(216, 222, 233, 0.70)
    rotate = 0
    reload_time = 2
    reload_cmd = /home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --art
    position = 730, 57
    halign = left
    valign = bottom
    zindex = 1
}

# Player Background Box
shape {
    monitor =
    color = rgba(100, 114, 125, 0.4)
    size = 500, 140
    rounding = 10
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 0
}

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --title)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 55, 138
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --player)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 13
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 205, 45
    halign = center
    valign = bottom
    zindex = 1
}

# Artist name
label {
    monitor =
    text = cmd[update:1000] echo "  $(/home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --artist)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 55, 118
    halign = center
    valign = bottom
    zindex = 1
}

# Previous track button
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    onclick = playerctl previous
    position = -5, 55
    halign = center
    valign = bottom
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] /home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --status
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    onclick = playerctl play-pause
    position = 55, 55
    halign = center
    valign = bottom
}

# Next track button
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    onclick = playerctl next
    position = 110, 55
    halign = center
    valign = bottom
}

# Current position timestamp
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --position)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Nunito, JetBrainsMono Nerd Font
    position = -100, 95
    halign = center
    valign = bottom
}

# Total length timestamp
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --length)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 210, 95
    halign = center
    valign = bottom
}

# Progress bar
label {
    monitor =
    text = cmd[update:1000] /home/lc3124/.config/hypr/hyprlock-styles/a3-hyprlock-music.sh --progress-bar
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 55, 95
    halign = center
    valign = bottom
}
