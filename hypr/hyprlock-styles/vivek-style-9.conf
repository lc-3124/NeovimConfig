# =============================================================================
# hyprlock style: VivekRajan Style-9  (big centred clock, avatar, "Hi, user")
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-9/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hyprlock.png -> resource/images/background.png
#   * fonts      : "SF Pro Display Bold" -> Nunito, JetBrainsMono Nerd Font
#   * removed    : general { no_fade_in, grace, disable_loading_bar } (invalid in 0.9.6)
#   * added      : auth { fingerprint { ... } }
#   * replaced   : avatar image (/home/vivek/.config/hypr/vivek.png) -> Nerd Font user glyph
#   * replaced   : ~/.config/hypr/Scripts/songdetail.sh -> hyprlock-styles/songdetail.sh
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/background.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">Enter Pass</span></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

# Profile icon (was: image /home/vivek/.config/hypr/vivek.png)
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.70)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/songdetail.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font, Nunito
    position = 0, 60
    halign = center
    valign = bottom
}
