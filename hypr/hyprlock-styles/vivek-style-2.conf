# =============================================================================
# hyprlock style: VivekRajan Style-2  (giant display clock, centred)
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-2/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hypr.png -> resource/images/lock-bg.png
#   * fonts      : "steelfish outline regular" / "SF Pro Display Bold" -> Nunito, JetBrainsMono Nerd Font
#   * removed    : general { no_fade_in, grace, disable_loading_bar } (invalid in 0.9.6)
#   * removed    : foreground image (foreground.png - part of the original wallpaper)
#                  -> meaningless with a different background, would render as a hard cut-out
#   * added      : auth { fingerprint { ... } }
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/lock-bg.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, .7)
    font_size = 160
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 370
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .7)
    font_size = 28
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 490
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 18
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"> Enter Pass</span></i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}
