# =============================================================================
# hyprlock style: VivekRajan Style-6  (top clock, avatar + name, square input)
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-6/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hyprlock.png -> resource/images/background.png
#   * background : blur_passes 0 -> 2 (readability over a photographic wallpaper)
#   * fonts      : "SF Pro Display *" -> Nunito, JetBrainsMono Nerd Font
#   * removed    : general { no_fade_in, grace, disable_loading_bar } (invalid in 0.9.6)
#   * added      : auth { fingerprint { ... } }
#   * replaced   : avatar image (user.png) -> Nerd Font user glyph label
#   * replaced   : ~/.config/hypr/Scripts/songdetail.sh -> hyprlock-styles/songdetail.sh
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/background.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, .65)
    font_size = 22
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 420
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(255, 255, 255, .65)
    font_size = 90
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# USER-PHOTO -> Nerd Font glyph
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.65)
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = -105, 30
    halign = center
    valign = center
}

# USER-NAME
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, .65)
    font_size = 22
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# PASSWORD-TEXT
label {
    monitor =
    text = Password:
    color = rgba(255, 255, 255, .55)
    font_size = 17
    font_family = Nunito, JetBrainsMono Nerd Font
    position = -90, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 40
    rounding = 0
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(86, 90, 90, 1)
    inner_color = rgba(40, 40, 40, 1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 30, -125
    halign = center
    valign = center
}

# TOUCH ID
label {
    monitor =
    text = Touch Id or Enter Password
    color = rgba(255, 255, 255, .55)
    font_size = 14
    font_family = Nunito, JetBrainsMono Nerd Font
    position = -33, -190
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/lc3124/.config/hypr/hyprlock-styles/songdetail.sh)"
    color = rgba(255, 255, 255, 0.55)
    font_size = 17
    font_family = JetBrainsMono Nerd Font, Nunito
    position = 0, 30
    halign = center
    valign = bottom
}
