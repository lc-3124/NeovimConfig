# =============================================================================
# hyprlock style: VivekRajan Style-10  (weekday/date/time stack + user pill + power buttons)
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-10/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hyprlock.png -> resource/images/lock-bg.png
#   * fonts      : "SF Pro Display Bold" -> Nunito, JetBrainsMono Nerd Font
#   * removed    : empty general { } block (upstream had one, nothing in it)
#   * added      : auth { fingerprint { ... } }
#   * replaced   : avatar image ($HOME/.config/hypr/vivek.png) -> Nerd Font user glyph
#   * replaced   : onclick "reboot now" -> "systemctl reboot", "shutdown now" -> "systemctl poweroff"
#                  ("reboot now"/"shutdown now" need root and would silently fail here)
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/lock-bg.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Profile icon (was: image $HOME/.config/hypr/vivek.png)
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.80)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"> Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl reboot
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl poweroff
    position = 820, 100
    halign = left
    valign = bottom
}

# Suspend
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl suspend
    position = -820, 100
    halign = right
    valign = bottom
}
