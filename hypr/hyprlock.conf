# =============================================================================
# hyprlock style: VivekRajan Style-1  (left column: greeting / clock / avatar)
# source : github.com/MrVivekRajan/Hyprlock-Styles  ->  Style-1/hyprlock.conf
# licence: GPL-3.0 (upstream repo)
# adapted: hyprlock 0.9.6 / eDP-1 1600x900 logical (scale 1.2)
#   * background : hyprlock.png -> resource/images/background.png
#   * background : blur_passes 0 -> 2 (readability over a photographic wallpaper)
#   * fonts      : "SF Pro Display Bold" -> "Nunito, JetBrainsMono Nerd Font"
#   * removed    : general { no_fade_in, grace, disable_loading_bar } (invalid in 0.9.6)
#   * added      : auth { fingerprint { ... } }
#   * replaced   : avatar image (vivek.png) -> Nerd Font user glyph label
#   * REMOVED    : 底部"正在播放"标签块（媒体显示）—— 按用户要求去掉
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = /run/user/1000/hyprlock-bg.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    noise = 0.0
}

# AUTH (local addition: fingerprint unlock)
auth {
    fingerprint {
        enabled = true
        ready_message = ""
        present_message = ""
        retry_delay = 250
    }
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = rgba(216, 222, 233, .75)
    font_size = 55
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 150, 320
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, .75)
    font_size = 40
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 240, 240
    halign = left
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .75)
    font_size = 19
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 217, 175
    halign = left
    valign = center
}

# Profile icon (was: image ~/.config/hypr/vivek.png)
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, .80)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 270, 25
    halign = left
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false

    position = 160, -140
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 16
    font_family = Nunito, JetBrainsMono Nerd Font
    position = 275, -140
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Nunito, JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">  Enter Pass</span></i>
    hide_input = false
    position = 160, -220
    halign = left
    valign = center
}
