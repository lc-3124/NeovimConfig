# ============================================================================
# Hyprlock 锁屏配置
# 触发: Meta + L（见 configure/keybind.lua）
# 解锁: 输入用户密码
# ============================================================================

general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = false
    no_fade_in = false
    ignore_empty_input = true
    immediate_render = true
    # 允许在锁屏上显示音乐控制等（wm 的 locked 绑定仍生效）
}

# 背景：东方壁纸 + 高斯模糊压暗
background {
    monitor =
    path = /home/lc3124/.config/hypr/resource/images/爱丽丝和人偶.png
    blur_passes = 3
    blur_size = 6
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.25
    noise = 0.01
}

# 时钟
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 96
    font_family = "Noto Sans CJK SC"
    position = 0, 80
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%Y年%m月%d日  %A')"
    color = rgba(ffffffee)
    font_size = 22
    font_family = "Noto Sans CJK SC"
    position = 0, 8
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 340, 60
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(00000088)
    inner_color = rgba(00000066)
    font_color = rgb(ffffffff)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffffaa">输入密码解锁…</span>
    check_color = rgb(66cc66)
    fail_color = rgb(ff4444)
    fail_text = <i>密码错误</i>
    capslock_color = rgb(ffcc00)
    position = 0, -130
    halign = center
    valign = center
}
