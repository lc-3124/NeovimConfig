# ============================================================================
# hypridle — 常驻空闲守护
#   10 分钟（600s）无操作 → 执行 META+L 的锁屏脚本 scripts/lock.sh
#   已处于锁屏状态时不重复执行（condition_cmd: 有 hyprlock 就 defer）
#   由 configure/env.lua 的 hyprland.start 自动启动
# ============================================================================

general {
    # 收到 loginctl lock-session（如合盖/挂起前）时执行的锁屏命令
    lock_cmd = /home/lc3124/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 600
    on-timeout = /home/lc3124/.config/hypr/scripts/lock.sh
    condition_cmd = ! pidof hyprlock
}
