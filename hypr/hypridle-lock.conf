# ============================================================================
# 锁屏专用 idle 守护（只在 hyprlock 运行期间使用，由 lock.sh 启动 / 解锁时清理）
#   60 秒无操作 → 熄屏：走 META+ALT+K 的 toggle-screen.sh（wlopm DPMS off）
#   有输入      → 点亮屏幕
# ============================================================================

listener {
    timeout = 60
    on-timeout = /home/lc3124/.config/hypr/scripts/toggle-screen.sh
    on-resume  = wlopm --on '*'
    ignore_inhibit = true   # 锁屏期间忽略 inhibitor，确保一定会熄屏
}
