# ============================================================================
# Kitty 终端配置
# ============================================================================
# 主题：TokyoNight Storm（暗色）
# 字体：JetBrains Mono Nerd Font（含 Nerd 图标）
# 背景透明由 Hyprland 窗口规则控制，kitty 自身保持不透明
# ============================================================================

# ---- 字体 ----
font_family      JetBrains Mono Nerd Font
font_size 11.0                          

# ---- 光标（默认方块光标，可选注释项）----
# cursor_shape beam                         # 竖线光标
# cursor_trail 1                            # 光标拖尾

# ---- 启动 shell ----
shell zsh                                

# ---- 背景/透明度 ----
# 透明度由 Hyprland 窗口规则控制，kitty 自身不处理
background_opacity 1.0                  

# ---- 配色（TokyoNight Storm）----
background #101517                    
foreground #d8dee9                      
selection_background #434c5e           
selection_foreground #d8dee9           
cursor #d8dee9                          
cursor_text_color #2e3440             

# ---- 快捷键：字体缩放 ----
map ctrl+equal increase_font_size        
map ctrl+minus decrease_font_size       
map ctrl+0 reset_font_size          
