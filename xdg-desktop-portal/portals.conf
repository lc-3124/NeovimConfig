# ============================================================================
# xdg-desktop-portal 后端路由配置
# ============================================================================
# 决定各 portal 接口（截图/投屏/快捷键/远程输入/文件选择）由哪个后端实现。
# 修改后需重启 portal 服务生效：
#   systemctl --user restart xdg-desktop-portal
# ============================================================================

[preferred]
default=gtk                                        # 默认后端：gtk（未单独指定的接口）
org.freedesktop.impl.portal.ScreenCast=hyprland    # 屏幕录制 → Hyprland 原生
org.freedesktop.impl.portal.Screenshot=hyprland    # 屏幕截图 → Hyprland 原生
org.freedesktop.impl.portal.GlobalShortcuts=hyprland # 全局快捷键 → Hyprland
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect # 远程输入 → KDE Connect 桥接
org.freedesktop.impl.portal.FileChooser=termfilechooser  # 文件选择 → 终端文件选择器(yazi)
