-- ============================================================================
-- WirePlumber 蓝牙音频配置
-- ============================================================================
-- 目的：解决蓝牙耳机播放卡顿（缓冲不足/高码率传输吃力）
-- 手段：1) 优先使用更稳定的 AAC 编码  2) 加大音频节点缓冲延迟
-- 位置：~/.config/wireplumber/wireplumber.conf.d/51-bluetooth-buffer.conf
--        （软链至 NeovimConfig 仓库）
-- ============================================================================

wireplumber.settings = {
  -- 不自动切换到耳机模式（HSP/HFP 双向通话模式音质差，
  -- 保持 A2DP 高保真播放；需要通话时可手动切换）
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  -- 蓝牙音频编码优先级（按序协商，前者优先）：
  --   aac      → 码率稳定，兼容性好（首选，解决卡顿关键）
  --   sbc_xq   → SBC 高质量变体，码率波动大，易卡顿
  --   ldac/aptx_hd/aptx → 高音质编码（需设备支持）
  --   sbc      → 基础 SBC 兜底
  bluez5.codecs = [ aac sbc_xq ldac aptx_hd aptx sbc ]
  -- 允许使用 SBC-XQ（高码率 SBC）
  bluez5.enable-sbc-xq = true
  -- 默认采样率 48kHz（CD 级）
  bluez5.default.rate = 48000
  -- 默认双声道
  bluez5.default.channels = 2
}

monitor.bluez.rules = [
  {
    -- 规则1：所有蓝牙声卡自动连接为 A2DP 播放
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        -- 只自动连接 A2DP Sink（播放），不自动进耳机通话模式
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
  {
    -- 规则2：所有蓝牙输出节点加大缓冲，缓解卡顿
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        -- 缓冲延迟 2048 采样 / 48kHz ≈ 42.7ms（默认 1024≈21ms）
        -- 给蓝牙链路更多缓冲余量，链路抖动时不易欠载断音
        node.latency = "2048/48000"
      }
    }
  }
]
