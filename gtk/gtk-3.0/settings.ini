# ============================================================================
# GTK3 全局设置
# ============================================================================
# 影响所有 GTK3 应用（Thunar、Firefox 等）的外观与交互。
# 主题：adw-gtk3-dark（GNOME libadwaita 风格的暗色适配）
# ============================================================================

[Settings]
gtk-theme-name=adw-gtk3-dark           # 控件主题：adw-gtk3 暗色
gtk-icon-theme-name=Adwaita            # 图标主题：Adwaita（GNOME 默认）
gtk-font-name=Google Sans Flex Medium 11 @opsz=11,wght=500  # 界面字体：Google Sans Flex 中号 11pt
gtk-cursor-theme-name=Bibata-Modern-Classic  # 鼠标光标主题：Bibata 现代经典
gtk-cursor-theme-size=24               # 光标尺寸 24px
gtk-toolbar-style=GTK_TOOLBAR_ICONS    # 工具栏：仅图标
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR  # 工具栏图标：大
gtk-button-images=0                    # 按钮不显示图标（仅文字）
gtk-menu-images=0                      # 菜单不显示图标
gtk-enable-event-sounds=1              # 事件音效：开启
gtk-enable-input-feedback-sounds=0     # 输入反馈音效：关闭
gtk-xft-antialias=1                    # 字体抗锯齿：开
gtk-xft-hinting=1                      # 字体微调：开
gtk-xft-hintstyle=hintslight           # 微调级别：轻微
gtk-xft-rgba=rgb                       # 子像素渲染：RGB
gtk-application-prefer-dark-theme=1    # 应用优先使用暗色主题
