# ============================================================================
# GTK4 全局设置
# ============================================================================
# 影响 GTK4/libadwaita 应用（GNOME 系）。主题沿用 adw-gtk3-dark。
# ============================================================================

[Settings]
gtk-theme-name=adw-gtk3-dark           # 控件主题：adw-gtk3 暗色
gtk-icon-theme-name=Adwaita            # 图标主题：Adwaita
gtk-font-name=Google Sans Flex Medium 11 @opsz=11,wght=500  # 界面字体
gtk-cursor-theme-name=Bibata-Modern-Classic  # 鼠标光标主题
gtk-cursor-theme-size=24               # 光标尺寸 24px
gtk-application-prefer-dark-theme=1    # 应用优先暗色主题
