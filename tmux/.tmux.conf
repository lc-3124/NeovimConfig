# ============================================================================
# tmux 配置文件（~/.tmux.conf → NeovimConfig/tmux/.tmux.conf）
# 说明：
#   * 前缀键（prefix）默认 C-b，配合各快捷键使用
#   * 所有 set -g 为全局（所有会话/窗口生效）
#   * 主题使用 tokyo-night-tmux 插件，插件由 TPM 管理
# ============================================================================

# ----------------------------------------------------------------------------
# 终端类型与颜色
# ----------------------------------------------------------------------------
# 使用 256 色终端类型（更丰富的配色支持）
set -g default-terminal "tmux-256color"
# 追加 terminal-overrides：让 *256col* 类终端声明支持真彩色（TrueColor，24bit 色）
set -ga terminal-overrides ",*256col*:Tc"
# 光标样式覆盖：支持"竖条/块状光标"控制序列，使 tmux 内光标样式与终端同步
set -ga terminal-overrides '*:Ss\x1b[%d q:Se\x1b[2 q'

# ----------------------------------------------------------------------------
# 基本行为
# ----------------------------------------------------------------------------
set -g history-limit 10000      # 每个窗口/面板的回滚历史最多保留 10000 行
set -g mouse on                 # 启用鼠标支持（滚动/点击选面板/拖拽调大小）
set -g escape-time 0            # 退出键（Esc）响应延迟设为 0ms，esc 类按键更快

# ----------------------------------------------------------------------------
# 索引与标题
# ----------------------------------------------------------------------------
set -g base-index 1             # 窗口编号从 1 开始（而非默认 0）
set -g pane-base-index 1        # 面板编号从 1 开始
set -g renumber-windows on      # 关闭窗口后自动重排编号，避免空洞
set -g set-titles on            # 允许 tmux 更新终端窗口标题
set -g set-titles-string "#T"   # 终端标题显示当前窗口名（#T）
set -g display-panes-time 4000  # 面板切换提示（prefix+q）显示 4 秒

# ----------------------------------------------------------------------------
# 前缀键与基本键位
# ----------------------------------------------------------------------------
set -g prefix C-b               # 前缀键 = Ctrl+b
unbind C-space                  # 解绑默认的 Ctrl+Space（避免冲突）
bind , command-prompt "rename-window '%%'"   # prefix+, 重命名当前窗口（弹出输入）

# 面板间移动：prefix+h/j/k/l 向左/下/上/右切换焦点面板
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 面板大小调整：prefix+大写 H/J/K/L，每次调整 5 个单元格
# -r 表示"可重复"：按住 prefix 后连续按 H 可多次调整，无需反复按 prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 分屏：prefix+| 左右分屏（当前目录），prefix+- 上下分屏（当前目录）
# -c "#{pane_current_path}" 表示新面板打开在当前面板所在的目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 重载配置：prefix+r 重新加载本文件并提示
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------------------------------
# Tokyo Night 主题（插件 tokyo-night-tmux）选项
# ----------------------------------------------------------------------------
set -g @tokyo-night-tmux_theme "storm"     # 主题风格：storm（蓝调，与 Neovim 一致）
set -g @tokyo-night-tmux_transparent 0     # 状态栏不透明（0=不透明，1=透明）

set -g @tokyo-night-tmux_show_git 1        # 状态栏显示 Git 分支
set -g @tokyo-night-tmux_show_path 1       # 状态栏显示当前路径
set -g @tokyo-night-tmux_show_hostname 0   # 不显示主机名
set -g @tokyo-night-tmux_show_battery_widget 1 # 显示电池电量组件

# ----------------------------------------------------------------------------
# TPM 插件管理（tmux-plugin-manager）
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'               # TPM 本体
set -g @plugin 'tmux-plugins/tmux-sensible'     # 一套通用的"合理默认值"
set -g @plugin 'tmux-plugins/tmux-resurrect'    # 会话保存/恢复（手动）
set -g @plugin 'tmux-plugins/tmux-continuum'    # 定时自动保存/恢复（可选）
set -g @continuum-restore 'off'                 # 关闭启动时自动恢复
set -g @continuum-save-interval '0'             # 关闭自动保存间隔（0=不自动保存）
set -g @plugin 'janoamaral/tokyo-night-tmux'    # Tokyo Night 主题插件

# 手动保存/恢复会话（tmux-resurrect）
bind s run "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"     # prefix+s 保存当前会话
bind S run "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"  # prefix+Shift+s 恢复会话

# 启动 TPM（必须放在文件末尾，加载插件）
run '~/.tmux/plugins/tpm/tpm'

# ----------------------------------------------------------------------------
# 状态栏定制
# ----------------------------------------------------------------------------
# 去掉状态栏右侧组件，只保留左侧的窗口列表（简洁风格）
set -g status-right ""
