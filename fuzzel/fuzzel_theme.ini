# ============================================================================
# fuzzel 配色主题（TokyoNight Storm）
# 颜色格式：AARRGGBB（AA=透明度，ff=不透明）
# ============================================================================

[colors]
# 背景（深蓝黑，不透明）
background=24283bff
# 普通文字（浅蓝白）
text=c0caf5ff
# 选中项背景（深灰蓝）
selection=2f3346ff
# 选中项文字（浅蓝白）
selection-text=c0caf5ff
# 边框（主蓝色，dd≈87% 透明度）
border=7aa2f7dd
# 匹配文字高亮（亮青蓝）
match=7dcfffff
# 选中项中的匹配高亮
selection-match=7dcfffff