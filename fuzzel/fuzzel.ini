# ============================================================================
# fuzzel 启动器配置（Hyprland 默认启动器，Super+R 打开）
# ============================================================================

include="~/.config/fuzzel/fuzzel_theme.ini"  # 引入配色主题文件
font=JetBrains Mono Nerd Font:weight=bold    # 列表字体：JetBrains Mono 粗体
terminal=kitty -1                            # 应用/命令打开时使用的终端
prompt=">>  "                                # 输入框前缀提示符
layer=overlay                                # Wayland 层：overlay（悬浮最上层）

[border]
radius=17                                    # 边框圆角 17px
width=1                                      # 边框宽度 1px

[dmenu]
exit-immediately-if-empty=yes                # 输入为空时立即退出（减少误触弹出）
