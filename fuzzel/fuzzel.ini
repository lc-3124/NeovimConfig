# ============================================================================
# fuzzel 启动器配置（Hyprland 默认启动器，Super+R 打开）
# ============================================================================

# 引入配色主题文件
include="~/.config/fuzzel/fuzzel_theme.ini"
# 列表字体：JetBrains Mono 粗体
font=JetBrains Mono Nerd Font:weight=bold
# 应用/命令打开时使用的终端
terminal=kitty -1
# 输入框前缀提示符
prompt=">>  "
# Wayland 层：overlay（悬浮最上层）
layer=overlay

[border]
# 边框圆角 17px
radius=17
# 边框宽度 1px
width=1

[dmenu]
# 输入为空时立即退出（减少误触弹出）
exit-immediately-if-empty=yes